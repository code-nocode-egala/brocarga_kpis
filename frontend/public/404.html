<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page not found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font: 15px/1.5 system-ui, -apple-system, sans-serif;
        background: #fafafa;
        color: #111;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        text-align: center;
        padding: 2rem;
      }
      .code {
        font-size: 4.5rem;
        font-weight: 700;
        line-height: 1;
        margin: 0;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: #4b5563;
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-flex;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        font: inherit;
        text-decoration: none;
        background: #111;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/">Go home</a>
    </div>
  </body>
</html>
